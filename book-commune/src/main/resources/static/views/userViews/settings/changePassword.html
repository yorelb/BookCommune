<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Change Password | BookCommune </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../css/settingsStyles.css">
    <link rel="stylesheet" href="../../../css/globalStyles.css">
</head>
<body>
<div id="navbar-placeholder"></div>

<main class="main-content">
    <header class="page-header">
        <h1>Change Password</h1>
        <p>For your security, please confirm your current password to choose a new one.</p>
    </header>

    <div class="profile-container" style="justify-content: center; display: flex;">
        <div class="profile-card user-details" style="width: 100%; max-width: 500px;">

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message">Password successfully updated! Redirecting...</div>

            <form id="changePasswordForm">
                <div class="edit-form-group">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" required>
                </div>

                <div class="edit-form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" required>
                </div>

                <div class="edit-form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" required>
                </div>

                <div class="button-group">
                    <button type="submit" class="save-btn">Update Password</button>
                    <a href="profile.html" class="cancel-btn">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
<script src="/js/changePassword.js"></script>
<script src="/js/navbar.js"></script>
</body>
</html>
