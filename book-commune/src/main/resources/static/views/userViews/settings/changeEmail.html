<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Change Email | BookCommune </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../css/settingsStyles.css">
    <link rel="stylesheet" href="../../../css/userProfileStyles.css">


</head>
<!--TODO: TRY PUT THE JS FOR THESE HTML FILES IN THEIR OWN JS FILE-->
<body>

<div id="navbar-placeholder"></div>

<main class="main-content">
    <header class="page-header">
        <h1>Change Email</h1>
        <p>For your security, please confirm your current password to change your email address.</p>
    </header>

    <div class="profile-container" style="justify-content: center; display: flex;">
        <div class="profile-card user-details" style="width: 100%; max-width: 500px;">

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message">Email successfully updated! Redirecting...</div>

            <form id="changeEmailForm">
                <div class="edit-form-group">
                    <label for="currentEmail">Current Email</label>
                    <input type="email" id="currentEmail" required>
                </div>

                <div class="edit-form-group">
                    <label for="newEmail">New Email</label>
                    <input type="email" id="newEmail" required>
                </div>

                <div class="edit-form-group">
                    <label for="confirmPassword">Password</label>
                    <input type="password" id="confirmPassword" required>
                </div>

                <div class="button-group">
                    <button type="submit" class="save-btn">Update Email</button>
                    <a href="profile.html" class="cancel-btn">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="/js/changeEmail.js"></script>
<script src="/js/navbar.js"></script>
</body>
</html>
