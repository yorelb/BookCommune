<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Edit Profile | BookCommune </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../css/userProfileStyles.css">
<body>
<!--TODO: Shouldnt have to fill out every field before saving -->
<!--TODO: City etc. not saving-->
<div id="navbar-placeholder"></div>

<main class="main-content">
    <header class="page-header">
        <h1>Edit Profile</h1>
        <p>Update your personal information below.</p>
    </header>

    <div class="profile-container">

        <!-- Left Card -->
        <div class="profile-card user-identity">
            <h2 id="profileName">Loading...</h2>
            <p class="status-badge" id="profileUsername">@loading</p>

            <div class="picture-container">
            </div>
        </div>

        <!-- Right Card -->
        <div class="profile-card user-details">
            <div class="card-header">
                <h3 style="margin: 0;">Update Details</h3>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form id="editProfileForm">
                <div class="edit-form-group">
                    <label for="editProfilePicture">Profile Picture Link</label>
                    <input type="text" id="editProfilePicture" name="ProfilePicture" required>
                </div>

                <div class="edit-form-group">
                    <label for="editUsername">Username</label>
                    <input type="text" id="editUsername" name="username" required>
                </div>

                <div class="edit-form-group">
                    <label for="editCity">City</label>
                    <input type="text" id="editCity" name="city" required>
                </div>

                <div class="edit-form-group">
                    <label for="editCountry">Country</label>
                    <input type="text" id="editCountry" name="country" required>
                </div>

                <div class="edit-form-group">
                    <label for="editPostcode">Postcode</label>
                    <input type="text" id="editPostcode" name="postcode" required>
                </div>

                <div class="edit-form-group">
                    <label for="editBio">Bio</label>
                    <textarea id="editBio" name="bio" placeholder="Tell the community about yourself..."></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="save-btn">Save Changes</button>
                    <a href="profile.html" class="cancel-btn">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
<script src="/js/editProfile"></script>
<script src="/js/navbar.js"></script>
</body>
</html>
