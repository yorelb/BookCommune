<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> User Profile | BookCommune </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../css/userProfileStyles.css">
</head>
<body>

<!--TODO - MAKE EDIT PROFILE -->
<!--TODO - Check if emails are valid with confirmation (way later)-->

<div id="navbar-placeholder"></div>

<main class="main-content">

    <header class="page-header">
        <h1>Profile</h1>
        <p>View all your profile details here.</p>
    </header>

    <div class="profile-container">

        <!-- Left Card -->
        <div class="profile-card user-identity">
            <h2 id="profileName">Loading...</h2>
            <p class="status-badge" id="profileUsername">@loading</p>

            <div class="picture-container">
            </div>
        </div>

        <!-- Right Card -->
        <div class="profile-card user-details">

            <div class="card-header">
                <h3>Profile details</h3>
                <button id="editProfileBtn" class="edit-btn">Edit Profile</button>
            </div>

            <div class="details-grid">
                <div class="detail-item">
                    <p class="detail-label">Email</p>
                    <p class="detail-value" id="profileEmail">Loading...</p>
                </div>
                <div class="detail-item">
                    <p class="detail-label">City or Region</p>
                    <p class="detail-value" id="profileAddress">Loading...</p>
                </div>
                <div class="detail-item">
                    <p class="detail-label">Role</p>
                    <p class="detail-value" id="profileRole">Loading...</p>
                </div>
                <div class="detail-item">
                    <p class="detail-label">Books Borrowed</p>
                    <p class="detail-value" id="borrowedCount">Loading...</p>
                </div>
                <div class="detail-item">
                    <p class="detail-label">Books Lent</p>
                    <p class="detail-value" id="lentCount">Loading...</p>
                </div>
                <div class="detail-item">
                    <p class="detail-label">Bio</p>
                    <p class="detail-value" id="profileBio">Loading...</p>
                </div>
            </div>
        </div>
    </div>
</main>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const userJson = localStorage.getItem('loggedInUser');

        if (!userJson) {
            window.location.href = '../../startSession/login.html';
            return;
        }

        const user = JSON.parse(userJson);

        fetch(`/api/users/${user.id}`)
            .then(response => {
                if (!response.ok) throw new Error("Failed to fetch fresh user data");
                return response.json();
            })
            .then(user => {
                document.getElementById('profileName').textContent = user.name || 'Unknown User';
                document.getElementById('profileUsername').textContent = '@' + (user.username || 'user');
                document.getElementById('profileEmail').textContent = user.email || 'No email provided';
                document.getElementById('profileAddress').textContent = user.address || 'Location unknown';
                document.getElementById('profileBio').textContent = user.bio || 'This user has not written a bio yet.';
                document.getElementById('profileRole').textContent = user.roleName || 'Member';
                document.getElementById('borrowedCount').textContent = user.borrowedBooks ?? 0;
                document.getElementById('lentCount').textContent = user.lentBooks ?? 0;


                localStorage.setItem('loggedInUser', JSON.stringify(user));
            })
            .catch(error => {
                console.error("Error loading profile data from server:", error);
            });
    });

    // Edit Profile Button Click
    const editBtn = document.getElementById('editProfileBtn');
    if (editBtn) {
        editBtn.addEventListener('click', () => {
            window.location.href = 'editProfile.html';
        });
    }
</script>
<script src="/js/navbar.js"></script>
</body>
</html>
