<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bookCommune Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Delius&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/loginStyles.css">
</head>
<body>

<!-- Logo improve with a buble font todo -->
<div class="logo">bookCommune</div>

<!-- Background Scattered Books change up the variety or maybe discard it for something similae -->
<span class="bg-book b1">📘</span>
<span class="bg-book b2">📘</span>
<span class="bg-book b3">📕</span>
<span class="bg-book b4">📘</span>
<span class="bg-book b5">📘</span>
<span class="bg-book b6">📕</span>
<span class="bg-book b7">📕</span>
<span class="bg-book b8">📘</span>
<span class="bg-book b9">📕</span>
<span class="bg-book b10">📕</span>
<span class="bg-book b11">📘</span>

<div class="login-card">

    <div class="tabs-header">
        <div class="tab active">Login</div>
        <div class="tab">Sign up</div>
    </div>

    <div class="form-content">

        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
        </div>

        <a href="#" class="forgot-password">Forgot Password?</a>

        <button class="login-btn">Log in</button>

    </div>
</div>

</body>
</html>
