<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Check Your Email </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Delius&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/loginStyles.css">
</head>
<body>

<!-- Left side -->
<div class="split-left"></div>

<!-- Right side -->
<div class="split-right">
    <div class="form-container">

        <div class="brand">
            <h1>BookCommune</h1>
        </div>

        <h2 style="text-align: center; color: var(--first); margin-bottom: 1rem; font-weight: 700;">Check your inbox!</h2>

        <p class="welcome-text">
            We've sent a password reset link to your email address.
            Please check your spam folder if you don't see it within a few minutes.
        </p>

        <a href="login.html" style="text-decoration: none;">
            <button type="button" class="btn-primary">Back to Sign in</button>
        </a>

        <p class="signup-text" style="margin-top: 2rem;">
            Didn't receive the email? <a href="forgotPassword.html">Try again</a>
        </p>

    </div>
</div>

</body>
</html>
