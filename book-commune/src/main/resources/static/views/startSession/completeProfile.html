<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Complete Profile | BookCommune </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Delius&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/startSessionStyles.css">
</head>
<body>

<!-- Left side -->
<div class="split-left"></div>

<!-- Right side -->
<div class="split-right">
    <div class="form-container">

        <div class="brand">
            <h1>BookCommune</h1>
        </div>

        <p class="welcome-text">One last step! Tell us where you are lending from.</p>

        <form id="onboardingForm">
            <div id="onboardingAlert" style="display: none; margin-bottom: 1rem; text-align: center; font-size: 0.9rem; font-weight: 600;"></div>

            <div class="input-group">
                <input type="text" id="username" placeholder="Choose a username (e.g., Bookworm99)" required>
            </div>

            <div class="input-group">
                <input type="text" id="city" placeholder="City (e.g., Sheffield)" required>
            </div>

            <div class="input-group">
                <input type="text" id="country" placeholder="Country (e.g., UK)" required>
            </div>
<!--            TODO: Will need to check validity of postcodes/address-->
            <div class="input-group">
                <input type="text" id="postcode" placeholder="Postcode (S3 4BT)" required>
            </div>

            <div class="input-group">
                <input type="text" id="bio" placeholder="Short bio (e.g., Sci-fi lover & collector)">
            </div>

            <button type="submit" class="btn-primary">Save & Continue</button>
        </form>

        <p class="signup-text"><a href="login.html" style="color: var(--second);">Skip for now</a></p>

    </div>
</div>
<script src="/js/completeProfile.js"></script>
</body>
</html>
