<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Forgot Password </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Delius&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/loginStyles.css">
</head>
<body>

<!-- Left side -->
<div class="split-left"></div>

<!-- Right side -->
<div class="split-right">
    <div class="form-container">

        <div class="brand">
            <h1>BookCommune</h1>
        </div>

        <p class="welcome-text">Enter your email address and we'll send you a link to reset your password.</p>

        <form action="resetConfirmation.html">

            <div class="input-group">
                <input type="email" placeholder="Name@email.com" required>
            </div>

            <button type="submit" class="btn-primary">Send Reset Link</button>
        </form>

        <p class="signup-text">Remember your password? <a href="login.html">Back to Sign in</a></p>

    </div>
</div>

</body>
</html>
