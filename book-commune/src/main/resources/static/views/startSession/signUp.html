<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sign up </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Delius&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/loginStyles.css">
</head>
<body>

<!--TODO - Potentially add screen after successful sign up to do username and address -->
<!--TODO - Confirmation emails-->

<!-- Left side -->
<div class="split-left"></div>

<!-- Right side -->
<div class="split-right">
    <div class="form-container">

        <div class="brand">
            <h1>BookCommune</h1>
        </div>

        <p class="welcome-text">Join the commune today!</p>

        <form id="signUpForm">
            <div id="signUpAlert"></div>

            <div class="input-row">
                <div class="input-group">
                    <input type="text" id="firstName" placeholder="First Name" required>
                </div>
                <div class="input-group">
                    <input type="text" id="lastName" placeholder="Last Name" required>
                </div>
            </div>

            <div class="input-group">
                <input type="email" id="email" placeholder="Name@email.com" required>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Password" minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" required>
            </div>

            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" required>
                    I agree to the Terms & Conditions
                </label>
            </div>

            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <p class="signup-text">Already have an account? <a href="login.html">Sign in</a></p>

        <div class="divider">
            <span>or</span>
        </div>

        <button type="button" class="btn-social">
            <!-- Google Icon SVG -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </button>

    </div>
</div>

</body>

<script>
    document.getElementById('signUpForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const alertBox = document.getElementById('signUpAlert');
        alertBox.style.display = 'none';

        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            alertBox.style.color = '#88BDA4';
            alertBox.textContent = "Passwords do not match!";
            alertBox.style.display = 'block';
            return; // Stop the function here
        }

        const userPayload = {
            forename: firstName.charAt(0).toUpperCase() + firstName.slice(1).trim(),
            surname: lastName.charAt(0).toUpperCase() + lastName.slice(1).trim(),
            email: email,
            username: email,
            password: password
        };

        fetch('http://localhost:8080/api/users', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(userPayload)
        })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    return response.text().then(text => { throw new Error(text) });
                }
            })
            .then(data => {
                localStorage.setItem('newUser', JSON.stringify(data));
                alertBox.style.color = '#88BDA4';
                alertBox.textContent = "Account created successfully! Taking you to profile setup...";
                alertBox.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'completeProfile.html';
                }, 2000);
            })
            .catch(error => {
                console.error('Sign up error:', error);
                alertBox.style.color = 'red';
                alertBox.textContent = error.message || "Failed to create account. Please try again.";
                alertBox.style.display = 'block';
            });
    });
</script>
</html>
